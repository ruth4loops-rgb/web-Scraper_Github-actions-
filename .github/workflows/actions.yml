name: Web Scraper Auto-Update

# NOTE: GitHub Free cron schedules are NOT guaranteed to run exactly every minute.
# GitHub infrastructure queues scheduled jobs and may delay them by several minutes,
# especially during high load periods. '* * * * *' requests every minute but
# actual execution frequency depends on GitHub's runner availability.

on:
  workflow_dispatch:
  schedule:
    - cron: '* * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Log workflow start
        run: |
          echo "=============================================="
          echo "  WORKFLOW STARTED"
          echo "  UTC Time : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "  Runner   : $RUNNER_NAME"
          echo "  Run ID   : $GITHUB_RUN_ID"
          echo "  Run #    : $GITHUB_RUN_NUMBER"
          echo "=============================================="

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          echo "[DEPS] Installing at $(date -u '+%H:%M:%S') UTC..."
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          echo "[DEPS] All dependencies installed."

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "[GIT] Identity configured."

      - name: Run web scraper
        run: |
          echo "[SCRAPER] Started at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          python main.py
          echo "[SCRAPER] Finished at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

      - name: Show git status
        run: |
          echo "[GIT] --- Status ---"
          git status
          echo "[GIT] --- Diff summary ---"
          git diff --stat

      - name: Commit and push changes
        run: |
          git add web.md

          if git diff --cached --quiet; then
            echo "[COMMIT] No changes detected in web.md. Skipping commit."
          else
            echo "[COMMIT] Changes detected. Committing at $(date -u '+%H:%M:%S') UTC..."
            git commit -m "Auto update web scraping data"
            echo "[COMMIT] Commit created."

            echo "[PUSH] Pushing to origin main..."
            git push origin main
            echo "[PUSH] Push completed at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          fi

      - name: Log workflow end
        run: |
          echo "=============================================="
          echo "  WORKFLOW COMPLETED"
          echo "  UTC Time : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "=============================================="
